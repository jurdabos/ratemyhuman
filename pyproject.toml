[project]
name = "ratemyhuman"
version = "1.0.1"
description = "Facial valence detection from human face images"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Torda Balázs"}]
requires-python = ">=3.13,<3.14"
dependencies = [
    "acidbase @ git+https://github.com/jurdabos/acidbase.git",
    "anyio>=4.14.2",
    "brotli>=1.2.1",
    "certifi>=2026.10.18",
    "click>=8.1",
    "facenet-pytorch>=2.6.0",
    "filelock>=4.2.1",
    "fsspec>=2026.6.0",
    "gradio>=6.10.0",
    "gradio-client>=2.4.0",
    "idna>=3.15",
    "matplotlib>=3.10.8",
    "numpy>=2.1",
    # pillow >=12.2.0 patches CVE-2025-48379 (fixed 11.3.0) and CVE-2026-25990 (fixed 12.1.1);
    # the >=12.2.0 floor matches the ecosystem-wide bump and also clears CVE-2026-42311;
    # >=13.0.0 patches CVE-2026-96639. Mirrored in [tool.uv] override-dependencies below.
    "pillow>=13.0.0",
    "pytest>=9.0.3",
    "python-multipart>=0.0.27",
    "requests>=2.33.0",
    "scikit-learn>=1.6",
    "seaborn>=0.13.2",
    # setuptools >=83.0.0 patches CVE-2026-59890. setuptools is present as a
    # transitive dependency (via torch); the same floor is mirrored in [tool.uv]
    # override-dependencies below to defeat any transitive cap (keep the two in
    # lockstep).
    "setuptools>=83.0.0",
    "starlette>=1.3.1",
    # torch >=2.13.0 patches CVE-2025-3000. Stable 2.13.0+cu130 wheels replaced the
    # former cu128 nightlies (the nightly channel was only needed before Blackwell
    # support landed in stable; cu128 stable stops at torch 2.11.0). The CUDA build
    # (cu130) is selected by `[tool.uv.sources]` routing to the cu130 index below,
    # so it does not need to appear in the requirement string. torchvision 0.28.x
    # is the lockstep release for torch 2.13.x. Both floors are mirrored in
    # override-dependencies below.
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "transformers>=5.5.0",
    "urllib3>=2.8.0",
]

[project.scripts]
ratemyhuman = "ratemyhuman.cli:main"

[build-system]
requires = ["hatchling>=1,<2"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# Required for the `acidbase @ git+https://...` direct reference in dependencies.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/ratemyhuman"]

[tool.uv]
prerelease = "allow"
# Overriding facenet-pytorch 2.6.0's strict pins (unmaintained; MTCNN works fine with newer deps).
# Keep these in lockstep with [project.dependencies] above.
override-dependencies = [
    "numpy>=2.1",
    "pillow>=13.0.0",
    # setuptools floor defeats any transitive setuptools cap (the former torch cu128
    # nightlies capped it below 83), which otherwise blocks the CVE-2026-59890 fix.
    # Kept in lockstep with the [project.dependencies] setuptools floor above.
    "setuptools>=83.0.0",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
]

[[tool.uv.index]]
url = "https://pypi.org/simple"

# The index is marked ``explicit`` so uv only queries download.pytorch.org for
# the packages routed to it via [tool.uv.sources] below. The former setup
# (nightly cu128 index without ``explicit`` plus
# ``index-strategy = "unsafe-best-match"``) made uv fan out to the PyTorch
# index for *every* package.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[tool.pytest.ini_options]
markers = ["slow: marks tests that require GPU and model weights (deselect with '-m \"not slow\"')"]

[tool.coverage.report]
# Excluding standard script-entry guards: lines under `if __name__ == "__main__":`
# are only executed when a module is run directly (e.g. `python -m ratemyhuman.main`),
# which is out of scope for the unit-test suite.
exclude_also = [
    "if __name__ == .__main__.:",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
]
